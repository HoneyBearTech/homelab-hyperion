# The Hyperion stack. Every setting comes from .env (template: .env.example; reference: docs/interfaces.md); the
# one secret, autoheal's optional webhook, from autoheal.env (template: autoheal.env.example).
# Every image is pinned as name:tag@sha256:<digest>; Dependabot proposes updates (patch and minor ones merge
# automatically once CI passes). scripts/check_compose.py enforces the policy (docs/security.md#policy).

name: homelab-hyperion

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:?set PUID in .env}
  PGID: ${PGID:?set PGID in .env}
  TZ: ${TZ:?set TZ in .env}

# Health check timing shared by every service; each service adds its own test. During start_period a failing
# check doesn't count, and Docker checks every start_interval so a healthy service shows up within seconds. The
# long start_period keeps autoheal from restarting a service in the middle of a slow database migration after an
# upgrade (or, for Minecraft, while it downloads the server).
x-healthcheck: &healthcheck
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 10m
  start_interval: 5s

services:
  # --- Downloads ------------------------------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163@sha256:f9151e5bc1025c6d0a630d503210cdcb6bb55a7cc098562609d96a408d838902
    container_name: prowlarr
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]
    environment: *linuxserver-env
    ports:
      - "9696:9696"
    volumes:
      - ${PROWLARR_CONFIG_PATH:?set PROWLARR_CONFIG_PATH in .env}:/config

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.5.5-r0-ls292@sha256:6ce86cd2924985385641d5bcac0234e82df2da8baa6e1e02b4c0a95635445410
    container_name: qbittorrent
    restart: unless-stopped
    labels:
      autoheal: "true"
      # The downloads are transient and large; the apps that import them keep their own copies.
      org.honeybeartech.hyperion.backup.skip: "/downloads"
    healthcheck:
      <<: *healthcheck
      # The web UI's login page answers without a login.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports:
      - "8090:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${QBITTORRENT_CONFIG_PATH:?set QBITTORRENT_CONFIG_PATH in .env}:/config
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads

  # --- Start page and logs --------------------------------------------------------------------------------------
  heimdall:
    image: lscr.io/linuxserver/heimdall:v2.8.3-ls366@sha256:3c9e97c416c7f6d72a3fc12af01a37bd0e71d9e6588d25c40b47e391f39ff7fd
    container_name: heimdall
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
    environment:
      <<: *linuxserver-env
      # Heimdall's live stats may not query addresses on the LAN (the default).
      ALLOW_INTERNAL_REQUESTS: "false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${HEIMDALL_CONFIG_PATH:?set HEIMDALL_CONFIG_PATH in .env}:/config

  dozzle:
    image: amir20/dozzle:v11.3.2@sha256:0d8cf9702f422d65a7e8ad238785dc6b05b2b9c43c945f6bbdf3358ad5da5f6c
    container_name: dozzle
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/dozzle", "healthcheck"]
    labels:
      autoheal: "true"
      org.honeybeartech.hyperion.allow.docker-socket: >-
        Dozzle shows container logs by reading them through the Docker API. The socket is mounted read-only, which
        protects the socket file but not the API, so the web UI must stay on the LAN.
    environment:
      # Dozzle agents on other hosts whose containers Dozzle also shows; empty for this host only.
      DOZZLE_REMOTE_AGENT: ${DOZZLE_REMOTE_AGENT:-}
    ports:
      - "4040:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- Games ----------------------------------------------------------------------------------------------------
  # The image downloads the Bedrock Dedicated Server named by VERSION from Minecraft's site on start and runs it
  # as UID:GID. VERSION is pinned here, never LATEST: a newer server upgrades the world for good, so a new version
  # is a reviewed change (Dependabot doesn't see it). Other game settings live in server.properties in the data
  # directory; the image rewrites only the ones set below.
  minecraft:
    image: itzg/minecraft-bedrock-server:2026.10.0@sha256:0e0eaf6cabd90f6aff4c31a97f7f01aef780ced92de7a1304acdcd519e99b4f0
    container_name: minecraft
    restart: unless-stopped
    # On stop the image tells the server to save and shut down; give it time to write the world.
    stop_grace_period: 1m
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      # mc-monitor detects the transport (NetherNet here) by itself.
      test: ["CMD", "mc-monitor", "status-bedrock", "--host", "127.0.0.1", "--port", "19132"]
    environment:
      EULA: ${MINECRAFT_EULA:?set MINECRAFT_EULA=TRUE in .env to accept the Minecraft EULA}
      VERSION: "1.26.52.3"
      UID: ${PUID:?set PUID in .env}
      GID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
      # The world to open (its folder under worlds/). The image would otherwise reset it to "Bedrock level".
      LEVEL_NAME: ${MINECRAFT_LEVEL_NAME:?set MINECRAFT_LEVEL_NAME in .env}
      # Only the players in allowlist.json (in the data directory) can join.
      ALLOW_LIST: "true"
      # Since 1.26.50 clients connect only over NetherNet: a handshake on TCP 19132, then one UDP port per player
      # from this range (max-players is 10). The server tells each client the address and port to use, so it must
      # name an address the players can reach: the host's LAN address. LAN discovery (UDP broadcast) doesn't cross
      # Docker's network; players add the server by address.
      TRANSPORT: nethernet
      SERVER_UDP_PORTS: ${MINECRAFT_ADDRESS:?set MINECRAFT_ADDRESS in .env}:19140-19149:19140-19149
    ports:
      - "19132:19132/tcp"
      - "19140-19149:19140-19149/udp"
    volumes:
      - ${MINECRAFT_DATA_PATH:?set MINECRAFT_DATA_PATH in .env}:/data

  # --- Operations -----------------------------------------------------------------------------------------------
  # Restarts any container labelled autoheal: "true" that Docker reports unhealthy (Docker itself only restarts a
  # container whose process exits). It reaches Docker only through socket-proxy, which lets it list, inspect,
  # restart and stop containers and nothing else. Optional restart notices go to a webhook from autoheal.env.
  autoheal:
    image: willfarrell/autoheal:latest@sha256:e7f42d5365c7c4490dd0cafc2858bb9fd2d64a274448d2de2bb5c386f1af7a0f
    container_name: autoheal
    restart: unless-stopped
    # autoheal exits if it can't reach the proxy, so it starts only once the proxy answers. (After a host reboot
    # Docker starts both at once; autoheal then restarts until the proxy is up, a few seconds.)
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "pgrep", "-f", "autoheal"]
    labels:
      org.honeybeartech.hyperion.allow.latest: >-
        The image publishes "latest" (rebuilt regularly) and versioned tags only up to 1.2.0 from 2021, so the
        maintained image is "latest", pinned by digest.
    environment:
      DOCKER_SOCK: tcp://socket-proxy:2375
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      # Give a service time to shut down cleanly (and finish database or world writes) before it's restarted.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
      # Discord's webhook API reads the message from "content".
      WEBHOOK_JSON_KEY: content
    env_file:
      - path: autoheal.env
        required: false
    networks:
      - default
      - docker-proxy

  # The only service with the Docker socket besides Dozzle. It answers on an internal network with no published
  # port, and passes on only what autoheal needs: listing and inspecting containers, and restarting or stopping
  # them (CONTAINERS, ALLOW_RESTARTS). Creating, starting or deleting containers, exec, images, volumes and every
  # other POST are refused.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.6@sha256:8c059dcb7f496212967dcf1d4136f727f2a23eea4da881945c12b1414aafdf4c
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2375/_ping"]
    labels:
      autoheal: "true"
      org.honeybeartech.hyperion.allow.docker-socket: >-
        A filtering proxy so that autoheal never gets the socket itself: it allows only listing, inspecting,
        restarting and stopping containers, on an internal network with no published port. The socket mount is
        read-only, which protects the socket file but not the API; the proxy's filter is what limits it.
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

# socket-proxy's network: internal, so nothing on it can reach the outside world and nothing outside can reach the
# proxy; only autoheal joins it.
networks:
  docker-proxy:
    internal: true
