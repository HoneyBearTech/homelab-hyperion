# The Hyperion stack. Every setting comes from .env (template: .env.example; reference: docs/interfaces.md); the
# secrets a service can only read from its environment from <service>.env (templates: autoheal.env.example,
# steerhouse.env.example), Steerhouse's other secrets from files under CONFIG_ROOT/steerhouse/secrets and Dozzle's
# certificate and key from files under CONFIG_ROOT/dozzle/certs (Docker secrets, at the end).
# Every image is pinned as name:tag@sha256:<digest>; Dependabot proposes updates (patch, minor and major ones merge
# automatically once CI passes). scripts/check_compose.py enforces the policy (docs/security.md#policy).
# Each app's settings and data live in its own host folder, CONFIG_ROOT/<app>/config, and nowhere else: no named
# volumes, and no path into /var/lib/docker/volumes, which a volume prune deletes (docs/installing.md#where-data-lives).

name: homelab-hyperion

# Every service starts with no Linux capabilities and can't gain privileges (setuid binaries, file capabilities);
# a service that needs a capability adds back only that one, from Docker's default set (docs/security.md#hardening).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:?set PUID in .env}
  PGID: ${PGID:?set PGID in .env}
  TZ: ${TZ:?set TZ in .env}

# Health check timing shared by every service; each service adds its own test. During start_period a failing
# check doesn't count, and Docker checks every start_interval so a healthy service shows up within seconds. The
# long start_period keeps autoheal from restarting a service in the middle of a slow database migration after an
# upgrade (or, for Minecraft, while it downloads the server).
x-healthcheck: &healthcheck
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 10m
  start_interval: 5s

services:
  # --- Downloads ------------------------------------------------------------------------------------------------
  prowlarr:
    <<: *hardened
    image: lscr.io/linuxserver/prowlarr:version-2.6.5.5623@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797
    container_name: prowlarr
    # Its init (s6-overlay) runs as root: it takes ownership of the data for PUID:PGID (CHOWN), runs the app as that
    # user (SETUID, SETGID) and stops it cleanly on shutdown (KILL: without it the app is killed after the timeout).
    # Its root filesystem stays writable: the init runs from /run (a tmpfs there is mounted noexec, so it can't
    # start) and writes to the image's own directories.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]
    environment: *linuxserver-env
    ports:
      - "9696:9696"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/prowlarr/config:/config

  qbittorrent:
    <<: *hardened
    # linuxserver.io's version tag names qBittorrent and the libtorrent it is built on: 2.1, whose disk I/O reads and
    # writes files instead of mapping them into memory, which suits a network share (docs/dependencies.md#qbittorrent).
    # Dependabot follows this tag's rebuilds but can't read it as a version: a new qBittorrent is bumped by hand.
    image: lscr.io/linuxserver/qbittorrent:version-5.3.0_v2.1.2@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
    container_name: qbittorrent
    # Its init (s6-overlay) runs as root: it takes ownership of the data for PUID:PGID (CHOWN), runs the app as that
    # user (SETUID, SETGID) and stops it cleanly on shutdown (KILL: without it the app is killed after the timeout).
    # Its root filesystem stays writable: the init runs from /run (a tmpfs there is mounted noexec, so it can't
    # start) and writes to the image's own directories.
    # DAC_OVERRIDE: the init, as root, writes the default settings into a data directory that belongs to PUID.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - KILL
    restart: unless-stopped
    # Time to finish writing to /incomplete, which may be a network share, and exit cleanly on stop (as for the nightly
    # backup) instead of being killed after Docker's default 10 s in the middle of a write.
    stop_grace_period: 1m
    # A torrent client keeps a file open for every file of every active torrent. containerd 2.x (Docker Engine 29's
    # packages) gives containers a default limit of 1024 open files, which a few large torrents can use up
    # ("Too many open files"); containerd 1.7 gave about a million.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    labels:
      autoheal: "true"
      # The downloads (finished and incomplete) are transient and large; the apps that import them keep their own
      # copies.
      org.honeybeartech.hyperion.backup.skip: "/downloads,/incomplete"
    healthcheck:
      <<: *healthcheck
      # The web UI's login page answers without a login.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports:
      - "8090:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/qbittorrent/config:/config
      - ${DOWNLOADS_PATH:?set DOWNLOADS_PATH in .env}:/downloads
      # Torrents still downloading ("Keep incomplete torrents in" = /incomplete). Every path set in qBittorrent must
      # be under /downloads or /incomplete: anything else is lost when the container is recreated.
      - ${INCOMPLETE_PATH:?set INCOMPLETE_PATH in .env}:/incomplete

  # --- Start page and logs --------------------------------------------------------------------------------------
  heimdall:
    <<: *hardened
    image: lscr.io/linuxserver/heimdall:version-v2.8.3@sha256:134636c92aa9fd47291f63adb6dc71b7c4e3abdde69e382abbf4a51461f9908a
    container_name: heimdall
    # Its init (s6-overlay) runs as root: it takes ownership of the data for PUID:PGID (CHOWN), runs the app as that
    # user (SETUID, SETGID) and stops it cleanly on shutdown (KILL: without it the app is killed after the timeout).
    # Its root filesystem stays writable: the init runs from /run (a tmpfs there is mounted noexec, so it can't
    # start) and writes to the image's own directories.
    # DAC_OVERRIDE: the init, as root, sets up nginx, PHP and the app in directories that belong to PUID; FOWNER:
    # it sets the mode of the app's settings file (which holds its key). Ports 80 and 443 need no capability: Docker
    # lets any process in the container bind low ports.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
    environment:
      <<: *linuxserver-env
      # Heimdall's live stats may not query addresses on the LAN (the default).
      ALLOW_INTERNAL_REQUESTS: "false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/heimdall/config:/config

  dozzle:
    <<: *hardened
    image: amir20/dozzle:v11.3.5@sha256:dd09e6aaa9d5ad686b6017427a502c40dc862ba28445609813e5ea1f66f6dbdf
    container_name: dozzle
    restart: unless-stopped
    # Nothing it needs to keep is written to its root filesystem. Settings saved in its UI go to /data, its folder
    # under CONFIG_ROOT: Docker creates it owned by root, the user Dozzle runs as, so it writes there with no
    # capabilities. It connects to its agents with the homelab's own certificate and key (the secrets at the end),
    # never the pair built into every Dozzle image, which the agents refuse.
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/dozzle", "healthcheck"]
    labels:
      autoheal: "true"
      org.honeybeartech.hyperion.allow.docker-socket: >-
        Dozzle shows container logs by reading them through the Docker API. The socket is mounted read-only, which
        protects the socket file but not the API, so the web UI must stay on the LAN.
    environment:
      # Dozzle agents on other hosts whose containers Dozzle also shows; empty for this host only.
      DOZZLE_REMOTE_AGENT: ${DOZZLE_REMOTE_AGENT:-}
      DOZZLE_CERT: /run/secrets/dozzle_cert
      DOZZLE_KEY: /run/secrets/dozzle_key
    secrets:
      - dozzle_cert
      - dozzle_key
    ports:
      - "4040:8080"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/config:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- Games ----------------------------------------------------------------------------------------------------
  # The image downloads the Bedrock Dedicated Server named by VERSION from Minecraft's site on start and runs it
  # as UID:GID. VERSION is pinned here, never LATEST: a newer server upgrades the world for good, so a new version
  # is a reviewed change (Dependabot doesn't see it). Other game settings live in server.properties in the data
  # directory; the image rewrites only the ones set below.
  minecraft:
    <<: *hardened
    image: itzg/minecraft-bedrock-server:2026.10.1@sha256:6ff3abf645a88c5aafd88b7cf96d35cdfb1e0977a0c45c465a5b536cb1f1c4f9
    container_name: minecraft
    # Its entrypoint starts as root and switches to UID:GID before it downloads or runs the server, which needs
    # these two of Docker's default capabilities; everything after runs as UID:GID.
    cap_add:
      - SETUID
      - SETGID
    # The server and the world live in /data (its mount); the entrypoint writes nothing else but temporary files.
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    # On stop the image tells the server to save and shut down; give it time to write the world.
    stop_grace_period: 1m
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      # mc-monitor detects the transport (NetherNet here) by itself.
      test: ["CMD", "mc-monitor", "status-bedrock", "--host", "127.0.0.1", "--port", "19132"]
    environment:
      EULA: ${MINECRAFT_EULA:?set MINECRAFT_EULA=TRUE in .env to accept the Minecraft EULA}
      VERSION: "1.26.52.3"
      UID: ${PUID:?set PUID in .env}
      GID: ${PGID:?set PGID in .env}
      TZ: ${TZ:?set TZ in .env}
      # The world to open (its folder under worlds/). The image would otherwise reset it to "Bedrock level".
      LEVEL_NAME: ${MINECRAFT_LEVEL_NAME:?set MINECRAFT_LEVEL_NAME in .env}
      # Only the players in allowlist.json (in the data directory) can join.
      ALLOW_LIST: "true"
      # Since 1.26.50 clients connect only over NetherNet: a handshake on TCP 19132, then one UDP port per player
      # from this range (max-players is 10). The server tells each client the address and port to use, so it must
      # name an address the players can reach: the host's LAN address. LAN discovery (UDP broadcast) doesn't cross
      # Docker's network; players add the server by address.
      TRANSPORT: nethernet
      SERVER_UDP_PORTS: ${MINECRAFT_ADDRESS:?set MINECRAFT_ADDRESS in .env}:19140-19149:19140-19149
    ports:
      - "19132:19132/tcp"
      - "19140-19149:19140-19149/udp"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/minecraft/config:/data

  # --- Steerhouse (Ansible playbooks from a web UI) -------------------------------------------------------------
  # From Steerhouse's own deploy/compose.yaml (v0.11.0), without its `monitoring` profile: Argus, on another host,
  # scrapes the API's metrics and reads the read-only `analytics` views over the LAN. Steerhouse holds the SSH keys
  # and vault passwords of the machines it manages: only the database and the API get its secrets (Docker secrets,
  # files under CONFIG_ROOT/steerhouse/secrets, never backed up with the data), the workers none.
  # Networks: steerhouse-web (the web UI and the API), steerhouse-db (internal: the API and the database),
  # steerhouse-workers (the workers and the API's internal port; not internal, as playbooks reach the LAN over SSH)
  # and steerhouse-postgres-lan (the database alone, so its TLS port can be published).

  # The database. Runs as PUID:PGID (the image supports any user), so it needs no capability. Remote connections must
  # use TLS and may only log in as the read-only role grafana_ro; the app's own user, steerhouse, may only connect
  # from steerhouse-db (pg_hba.conf, from PG_HBA below). The certificate and key are in its folder, beside the
  # database (docs/installing.md#steerhouse).
  steerhouse-postgres:
    <<: *hardened
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: steerhouse-postgres
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    # The database is in its mount; the socket and the generated pg_hba.conf are in memory.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    restart: unless-stopped
    stop_grace_period: 1m
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql", "-U", "steerhouse", "-d", "steerhouse"]
    # Writes PG_HBA to pg_hba.conf before the image's own entrypoint starts the server. It comes from the environment,
    # not a Compose config, so that a change to it recreates the container on deploy.
    entrypoint:
      - /bin/sh
      - -c
      - umask 077 && printf '%s' "$$PG_HBA" >/tmp/pg_hba.conf && exec docker-entrypoint.sh "$$@"
      - steerhouse-postgres
    command:
      - postgres
      - -c
      - hba_file=/tmp/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
    environment:
      POSTGRES_USER: steerhouse
      POSTGRES_DB: steerhouse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Byte-order text sorting, independent of the host's glibc/ICU.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
      # First match wins. The socket (docker compose exec, the health check) is the container's own; steerhouse only
      # from steerhouse-db, whose range is fixed for this (STEERHOUSE_DB_SUBNET); grafana_ro over TLS from anywhere;
      # everything else, and every connection without TLS from outside steerhouse-db, is refused.
      PG_HBA: |
        # TYPE   DATABASE    USER        ADDRESS                     METHOD
        local    all         all                                     trust
        host     steerhouse  steerhouse  ${STEERHOUSE_DB_SUBNET:?set STEERHOUSE_DB_SUBNET in .env}  scram-sha-256
        hostssl  steerhouse  grafana_ro  all                         scram-sha-256
        host     all         all         all                         reject
    secrets:
      - source: steerhouse_postgres_password
        target: postgres_password
    ports:
      - "${STEERHOUSE_POSTGRES_PORT:?set STEERHOUSE_POSTGRES_PORT in .env}:5432"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse-postgres/config:/var/lib/postgresql
    networks:
      - steerhouse-db
      - steerhouse-postgres-lan

  # The API. Runs as PUID:PGID with no capabilities; its data (playbooks, run logs, Galaxy content, git checkouts) is
  # in /data, everything else in the database. The metrics port is published for Argus' Prometheus and answers only
  # with METRICS_TOKEN (steerhouse.env); the internal worker API (8001) is never published.
  steerhouse:
    <<: *hardened
    image: honeybeartech/steerhouse-backend:0.11.0@sha256:38db591deefde311e1f265539934d1b68eb3c9077c1d491b42798fae31fe5809
    container_name: steerhouse
    # Its images are published for linux/amd64 only (elsewhere, such as on a Mac, they run emulated).
    platform: linux/amd64
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    stop_grace_period: 1m
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)
    environment:
      ENVIRONMENT: production
      # The address people open it at, behind the reverse proxy (HTTPS): notifications link to it, single sign-on
      # builds its callbacks from it, passkeys only work there.
      PUBLIC_URL: ${STEERHOUSE_PUBLIC_URL:?set STEERHOUSE_PUBLIC_URL in .env}
      COOKIE_SECURE: "true"
      # Admins must set up two-factor login at their next password sign-in.
      REQUIRE_ADMIN_2FA: "true"
      # The workers reach the internal API on steerhouse-workers.
      INTERNAL_API_HOST: 0.0.0.0
      # The client's address comes from the web UI's container only.
      TRUSTED_PROXY_HOSTS: steerhouse-frontend
      # Listens only while METRICS_TOKEN (steerhouse.env) is set; published below, for Argus.
      METRICS_HOST: 0.0.0.0
      # Ansible, which the API loads at start and runs for Galaxy installs, keeps its working files in ~/.ansible:
      # in memory, as the image's home directory is on the read-only root (and isn't PUID's unless PUID is 1000).
      HOME: /tmp
    # WORKER_TOKEN and METRICS_TOKEN: the workers can't read secret files safely, so the token they share with the API
    # is in the environment (Steerhouse's docs/installing.md). Missing, the API refuses to start.
    env_file:
      - path: steerhouse.env
        required: false
    # Read from /run/secrets/<name>. grafana_db_password only for the one-off command that creates the role
    # grafana_ro (docs/installing.md#steerhouse).
    secrets:
      - source: steerhouse_database_url
        target: database_url
      - source: steerhouse_auth_secret_key
        target: auth_secret_key
      - source: steerhouse_credential_encryption_key
        target: credential_encryption_key
      - source: steerhouse_admin_password
        target: admin_password
      - source: steerhouse_grafana_db_password
        target: grafana_db_password
    ports:
      - "${STEERHOUSE_METRICS_PORT:?set STEERHOUSE_METRICS_PORT in .env}:8002"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/config:/data
    networks:
      steerhouse-web:
        # The web UI's nginx sends the API's requests to "backend".
        aliases: [backend]
      steerhouse-db: {}
      steerhouse-workers: {}
    depends_on:
      steerhouse-postgres:
        condition: service_healthy

  # Runs the playbooks. Root with only these capabilities, as Steerhouse ships it: it runs each slot's playbooks as a
  # user of its own (SETUID, SETGID; CHOWN for their home directories; KILL to stop them) and keeps them away from the
  # API and cloud metadata with firewall rules in its own network namespace (NET_ADMIN; playbooks never hold it). It
  # has no secrets and no database, only the API's internal port and the Galaxy content, read-only.
  steerhouse-worker:
    <<: *hardened
    image: honeybeartech/steerhouse-backend:0.11.0@sha256:38db591deefde311e1f265539934d1b68eb3c9077c1d491b42798fae31fe5809
    container_name: steerhouse-worker
    # Its images are published for linux/amd64 only (elsewhere, such as on a Mac, they run emulated).
    platform: linux/amd64
    command: ["python", "-m", "app.worker"]
    user: "0"
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 1024
    restart: unless-stopped
    # Time for running playbooks to finish (30 s) before they are stopped.
    stop_grace_period: 1m
    labels:
      autoheal: "true"
      org.honeybeartech.hyperion.allow.cap-add: >-
        NET_ADMIN, outside Docker's default set: the worker's egress filter installs nftables rules in the worker's
        own network namespace so that playbook runs can't reach the API or cloud metadata; a production worker
        without it refuses to start. Playbooks run as unprivileged slot users and never hold it. The owner agreed
        on 2026-10-22.
    healthcheck:
      <<: *healthcheck
      # The image's own check is the API's. The worker has no port; it works as long as it reaches the API's internal
      # port, where it claims runs and reports back.
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('steerhouse', 8001), timeout=5).close()
    environment:
      ENVIRONMENT: production
      STEERHOUSE_API_URL: http://steerhouse:8001
      # Runs at once.
      WORKER_SLOTS: 2
      GALAXY_DIR: /galaxy
      WORKER_EGRESS_FILTER: "true"
      WORKER_ALLOW_CLOUD_METADATA: "false"
      # From steerhouse.env, the worker needs only WORKER_TOKEN.
      METRICS_TOKEN: ""
    env_file:
      - path: steerhouse.env
        required: false
    volumes:
      # The API's Galaxy roles and collections; the API creates the folder when it starts, before any worker.
      - type: bind
        source: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/config/galaxy
        target: /galaxy
        read_only: true
    networks:
      - steerhouse-workers
    depends_on:
      steerhouse:
        condition: service_healthy

  # The web UI (nginx, as an unprivileged user, on 8080): serves the app and passes /api/ (and its WebSockets) to the
  # API. Ares' reverse proxy fronts its port with HTTPS. Its root filesystem stays writable: its entrypoint writes the
  # trusted-proxy settings (TRUSTED_PROXIES) into /etc/nginx/conf.d when it starts.
  steerhouse-frontend:
    <<: *hardened
    image: honeybeartech/steerhouse-frontend:0.11.0@sha256:e4519468d856ee752e17cf4c5478f8230ec9644b929ad2ce551d28117568ac4c
    container_name: steerhouse-frontend
    # Its images are published for linux/amd64 only (elsewhere, such as on a Mac, they run emulated).
    platform: linux/amd64
    restart: unless-stopped
    labels:
      autoheal: "true"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
    environment:
      # Who may name the client in X-Forwarded-For: the reverse proxy's address, which login throttling and the audit
      # log rely on. Never "gateway" here: the port is published to the LAN.
      TRUSTED_PROXIES: ${STEERHOUSE_TRUSTED_PROXIES:?set STEERHOUSE_TRUSTED_PROXIES in .env}
    ports:
      - "${STEERHOUSE_PORT:?set STEERHOUSE_PORT in .env}:8080"
    networks:
      - steerhouse-web
    depends_on:
      steerhouse:
        condition: service_healthy

  # --- Operations -----------------------------------------------------------------------------------------------
  # Restarts any container labelled autoheal: "true" that Docker reports unhealthy (Docker itself only restarts a
  # container whose process exits). It reaches Docker only through socket-proxy, which lets it list, inspect,
  # restart and stop containers and nothing else. Optional restart notices go to a webhook from autoheal.env.
  autoheal:
    <<: *hardened
    image: willfarrell/autoheal:latest@sha256:e7f42d5365c7c4490dd0cafc2858bb9fd2d64a274448d2de2bb5c386f1af7a0f
    container_name: autoheal
    restart: unless-stopped
    read_only: true
    # autoheal exits if it can't reach the proxy, so it starts only once the proxy answers. (After a host reboot
    # Docker starts both at once; autoheal then restarts until the proxy is up, a few seconds.)
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "pgrep", "-f", "autoheal"]
    labels:
      org.honeybeartech.hyperion.allow.latest: >-
        The image publishes "latest" (rebuilt regularly) and versioned tags only up to 1.2.0 from 2021, so the
        maintained image is "latest", pinned by digest.
    environment:
      DOCKER_SOCK: tcp://socket-proxy:2375
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      # Give a service time to shut down cleanly (and finish database or world writes) before it's restarted.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
      # Discord's webhook API reads the message from "content".
      WEBHOOK_JSON_KEY: content
    env_file:
      - path: autoheal.env
        required: false
    networks:
      - default
      - docker-proxy

  # The only service with the Docker socket besides Dozzle. It answers on an internal network with no published
  # port, and passes on only what autoheal needs: listing and inspecting containers, and restarting or stopping
  # them (CONTAINERS, ALLOW_RESTARTS). Creating, starting or deleting containers, exec, images, volumes and every
  # other POST are refused.
  socket-proxy:
    <<: *hardened
    image: lscr.io/linuxserver/socket-proxy:3.4.7@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2375/_ping"]
    labels:
      autoheal: "true"
      org.honeybeartech.hyperion.allow.docker-socket: >-
        A filtering proxy so that autoheal never gets the socket itself: it allows only listing, inspecting,
        restarting and stopping containers, on an internal network with no published port. The socket mount is
        read-only, which protects the socket file but not the API; the proxy's filter is what limits it.
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

networks:
  # socket-proxy's network: internal, so nothing on it can reach the outside world and nothing outside can reach the
  # proxy; only autoheal joins it.
  docker-proxy:
    internal: true
  # Steerhouse's web UI and API. Not internal: the API fetches Galaxy content and git repositories, and sends mail.
  steerhouse-web: {}
  # Steerhouse's API and database, with no way out. Its address range is fixed so that pg_hba.conf can tell the app's
  # connections from the LAN's.
  steerhouse-db:
    internal: true
    ipam:
      config:
        - subnet: ${STEERHOUSE_DB_SUBNET:?set STEERHOUSE_DB_SUBNET in .env}
  # Steerhouse's workers and the API's internal port. Not internal: playbooks reach the machines they manage.
  steerhouse-workers: {}
  # The database alone, so its port can be published (an internal network can't publish one).
  steerhouse-postgres-lan: {}

# Steerhouse's secrets, as files on the host (docs/installing.md#steerhouse); Compose mounts each read-only at
# /run/secrets/<target> in the services that list it. Never committed, and never in the stack's backups: keep them,
# and above all credential_encryption_key, in a password manager.
# Then the certificate and key Dozzle and its agents authenticate each other with: one pair, made once with
# `dozzle generate-certs`, the same here and on every agent (docs/installing.md#dozzles-certificate). Owned by root:
# Dozzle runs as root without capabilities, so it can read only a file that root owns. Dozzle doesn't start while one
# is missing, so it never falls back to the built-in pair. Never committed or backed up either: keep the key in the
# password manager too.
secrets:
  steerhouse_postgres_password:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/secrets/postgres_password
  steerhouse_database_url:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/secrets/database_url
  steerhouse_auth_secret_key:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/secrets/auth_secret_key
  steerhouse_credential_encryption_key:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/secrets/credential_encryption_key
  steerhouse_admin_password:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/secrets/admin_password
  steerhouse_grafana_db_password:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/steerhouse/secrets/grafana_db_password
  dozzle_cert:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_cert.pem
  dozzle_key:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_key.pem
