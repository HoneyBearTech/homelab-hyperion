version: 2
# Patch, minor and major updates are auto-merged once every required check passes
# (workflows/dependabot-auto-merge.yml; majors since 2026-10-14, the owner's call). A merge deploys: the server's
# pull agent applies main within minutes, so a major, which can migrate a service's data one way, reaches the
# server unattended with the nightly backup behind it. An update Dependabot can't classify waits for the
# maintainer.
updates:
  # The stack's images in compose.yaml (version tag and digest). qBittorrent's tag also names its libtorrent
  # (version-5.3.0_v2.1.2), which Dependabot can't read as a version: it proposes that tag's rebuilds only, and a
  # new qBittorrent version is bumped by hand (docs/dependencies.md#qbittorrent).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    ignore:
      # Dozzle runs upstream's test build of its fix for agents that were down when it started (the pr-5626 tag),
      # and Dependabot would follow that tag into other pull requests' test builds. Dozzle stays ignored until the
      # first release that contains the fix: that release is pinned by hand, in a pull request that removes this
      # entry (docs/dependencies.md#dozzle).
      - dependency-name: "amir20/dozzle"

  # The check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version.
      codeql:
        patterns:
          - "github/codeql-action*"
