version: 2
# Patch and minor updates are auto-merged once every required check passes
# (workflows/dependabot-auto-merge.yml); major updates wait for the maintainer, since a new major version
# can migrate a service's data one way. A merge changes main only; the server is updated by a
# deliberate redeploy.
updates:
  # The stack's images in compose.yaml (version tag and digest).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    ignore:
      # Two stale 2021 tags of qBittorrent's image look like newer versions than 5.x (they name an old build's
      # Ubuntu base); without this, Dependabot would propose them.
      - dependency-name: "*qbittorrent"
        versions: ["14.3.9", "20.04.1"]

  # The check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version.
      codeql:
        patterns:
          - "github/codeql-action*"
