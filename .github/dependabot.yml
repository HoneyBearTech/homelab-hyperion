version: 2
# Patch, minor and major updates are auto-merged once every required check passes
# (workflows/dependabot-auto-merge.yml; majors since 2026-10-14, the owner's call). A merge deploys: the server's
# pull agent applies main within minutes, so a major, which can migrate a service's data one way, reaches the
# server unattended with the nightly backup behind it. An update Dependabot can't classify waits for the
# maintainer.
updates:
  # The stack's images in compose.yaml (version tag and digest).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    ignore:
      # qBittorrent stays on 4.5.5 until the server has moved to this stack, so the move changes one thing at a
      # time; the upgrade is its own pull request, which removes this entry.
      - dependency-name: "*qbittorrent"
      # Steerhouse's database: a new PostgreSQL major can't open the old one's data (it needs pg_upgrade, or a dump
      # and a restore), so a major is a pull request of its own, made by hand. Minor releases (18.x) come as usual.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The check and test tools (requirements-dev.txt), pinned with hashes.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees: ["HoneyBearTech"]
    groups:
      # init, analyze and upload-sarif must share one version.
      codeql:
        patterns:
          - "github/codeql-action*"
